  background:#0f0d0a;
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--text);
  padding:10px 12px;
  width:100%;
  outline:none
}

.field:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(242,179,61,.18)
}

.gold-btn{
  background:linear-gradient(180deg,#ffd97a,#e79a18);
  color:#231700;
  font-weight:900;
  border:0;
  border-radius:14px;
  padding:12px 18px;
  box-shadow:0 8px 24px rgba(242,179,61,.22)
}

.gold-btn:disabled{
  opacity:.5;
  box-shadow:none
}

.ghost-btn{
  background:#241e16;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 14px;
  font-weight:700
}

.ghost-btn:hover,.gold-btn:hover{
  filter:brightness(1.07)
}

.ghost-btn.active{
  background:var(--gold);
  color:#231700;
  border-color:var(--gold)
}

.range{
  accent-color:var(--gold);
  width:100%
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px
}

.card.active{
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(242,179,61,.22),0 16px 40px rgba(0,0,0,.35)
}

.chip{
  font-size:12px;
  border-radius:99px;
  padding:4px 9px;
  font-weight:800
}

.hover\:border-\[\#f2b33d\]:hover {
  --tw-border-opacity: 1;
  border-color: rgb(242 179 61 / var(--tw-border-opacity, 1));
}

@media (min-width: 640px) {
  .sm\:bottom-12 {
    bottom: 3rem;
  }

  .sm\:inline {
    display: inline;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-4 {

  }

  .sm\:p-8 {

  }

  .sm\:px-4 {
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .sm\:\!text-sm {
    font-size: 0.875rem !important;
    line-height: 1.25rem !important;
  }

  .sm\:text-3xl {
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }

  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }

  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }

  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px) {
  .md\:inline-flex {
    display: inline-flex;
  }
}

@media (min-width: 1024px) {
  .lg\:inline {
